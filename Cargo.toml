[package]
name = "delegated-sudo"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
description = "Local executable grants with expiring bearer tokens"

[features]
integration-tests = ["dep:nix"]

[[bin]]
name = "delegated-sudo-check"
path = "test-support/acceptance.rs"
required-features = ["integration-tests"]

[dependencies]
clap = { version = "4.5", features = ["derive"] }
getrandom = "0.3"
libc = "0.2"
nix = { version = "0.30", optional = true, features = ["fs", "user"] }
rpassword = "7.4"
rusqlite = { version = "0.37", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
shlex = "2"

[profile.release]
lto = "thin"
strip = true
